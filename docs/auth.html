<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Masuk - Jimpitan RT 09</title>
    <meta name="description" content="Masuk ke aplikasi Jimpitan RT 09" />
    <meta name="theme-color" content="#f8fafc" />
    <link rel="icon" type="image/svg+xml" href="icons/icon-192.svg" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <div class="auth-glow auth-glow-top"></div>
      <div class="auth-glow auth-glow-right"></div>

      <section class="auth-content">
        <div class="auth-brand">
          <div class="auth-logo-wrap">
            <img
              src="icons/icon-192.svg"
              alt="Logo Jimpitan RT 09"
              class="auth-logo"
              width="40"
              height="40"
            />
          </div>
          <h1>Jimpitan RT 09</h1>
        </div>

        <div class="auth-card">
          <div class="auth-heading">
            <h2>Masuk</h2>
            <p>Masukkan nomor rumah untuk melanjutkan</p>
          </div>

          <form id="form-login" novalidate>
            <div class="auth-field">
              <label for="login-user">Nomor Rumah</label>
              <div class="auth-input-wrap">
                <svg aria-hidden="true" viewBox="0 0 24 24">
                  <path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" />
                </svg>
                <input
                  id="login-user"
                  name="username"
                  type="text"
                  placeholder="Contoh: A6"
                  autocomplete="username"
                  autocapitalize="characters"
                  required
                />
              </div>
            </div>

            <div class="auth-field">
              <div class="auth-label-row">
                <label for="login-pass">Password</label>
                <a href="#" data-support-link>Lupa Password?</a>
              </div>
              <div class="auth-input-wrap">
                <svg aria-hidden="true" viewBox="0 0 24 24">
                  <rect x="5" y="10" width="14" height="11" rx="2" />
                  <path d="M8 10V7a4 4 0 0 1 8 0v3" />
                </svg>
                <input
                  id="login-pass"
                  name="password"
                  type="password"
                  placeholder="Masukkan password"
                  autocomplete="current-password"
                  required
                />
                <button
                  id="toggle-password"
                  class="auth-password-toggle"
                  type="button"
                  aria-label="Tampilkan password"
                  aria-pressed="false"
                >
                  <svg class="eye-visible" aria-hidden="true" viewBox="0 0 24 24">
                    <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                  <svg class="eye-hidden" aria-hidden="true" viewBox="0 0 24 24">
                    <path
                      d="m3 3 18 18M10.6 6.2A11 11 0 0 1 12 6c6.5 0 10 6 10 6a17 17 0 0 1-2.2 2.9M6.6 6.7C3.6 8.5 2 12 2 12s3.5 6 10 6c1.3 0 2.5-.2 3.5-.6M10 10a3 3 0 0 0 4 4"
                    />
                  </svg>
                </button>
              </div>
            </div>

            <button id="btn-submit-login" class="auth-submit" type="submit">
              <span>Masuk</span>
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m13 5 7 7-7 7M20 12H4" /></svg>
            </button>
          </form>
        </div>

        <div class="auth-notice">
          <span aria-hidden="true">i</span>
          <p>
            Password awal diberikan oleh pengurus RT. Untuk akun pengurus gunakan nomor
            <strong>ADMIN</strong>.
          </p>
        </div>
      </section>

      <footer class="auth-footer">
        <p>Kendala login? <a href="#" data-support-link>Hubungi Ketua RT</a></p>
        <div class="auth-home-indicator"></div>
      </footer>
    </main>

    <div id="toast-container" class="toast-container" aria-live="polite"></div>
    <div id="loading-overlay" class="loading-overlay" role="status" aria-live="polite">
      <div class="spinner"></div>
      <div id="loading-text" class="loading-text">Sedang masuk...</div>
    </div>
    <script type="module" src="js/auth.js"></script>
  </body>
</html>
