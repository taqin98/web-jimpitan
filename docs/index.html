<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>Jimpitan RT 09 - Rotasi & Pencatatan</title>
    <meta name="description" content="Aplikasi rotasi jadwal dan pencatatan jimpitan RT 09" />
    <meta name="theme-color" content="#10b981" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="icons/icon-192.svg" />
    <link rel="apple-touch-icon" href="icons/icon-192.svg" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div class="app-container">
      <header class="app-header">
        <div class="header-brand">
          <img
            src="icons/icon-192.svg"
            alt="Logo Jimpitan"
            class="header-logo"
            width="32"
            height="32"
          />
          <div>
            <div class="header-title">Jimpitan RT 09</div>
            <div class="header-subtitle">Rotasi & Jadwal Warga</div>
          </div>
        </div>
        <div class="header-actions">
          <span id="header-user-badge" class="badge badge-info" hidden></span>
          <button id="btn-admin-nav" class="btn btn-secondary btn-sm" hidden type="button">
            Admin
          </button>
          <button id="btn-logout" class="btn btn-secondary btn-sm" hidden type="button">
            Keluar
          </button>
        </div>
      </header>

      <div
        id="app-sections"
        data-fragments="sections/change-password.html,sections/calendar.html,sections/input.html,sections/recap.html,sections/admin.html"
      ></div>
    </div>

    <div id="app-overlays" data-fragments="sections/overlays.html"></div>
    <script type="module" src="js/bootstrap.js"></script>
  </body>
</html>
