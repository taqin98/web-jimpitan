<section id="screen-change-password" class="screen">
  <div class="card" style="margin-top: 20px">
    <h1 class="card-title" style="font-size: 18px">Buat Password Baru</h1>
    <p class="section-description">
      Ini adalah login pertama Anda. Wajib mengganti password awal demi keamanan akun.
    </p>
    <form id="form-change-password">
      <input
        id="change-password-user"
        class="visually-hidden"
        type="text"
        name="username"
        autocomplete="username"
        tabindex="-1"
        aria-hidden="true"
      />
      <div class="form-group">
        <label for="pwd-old" class="form-label">Password Lama</label>
        <input
          id="pwd-old"
          type="password"
          class="form-input"
          autocomplete="current-password"
          required
        />
      </div>
      <div class="form-group">
        <label for="pwd-new" class="form-label">Password Baru (min. 4 karakter)</label>
        <input
          id="pwd-new"
          type="password"
          class="form-input"
          autocomplete="new-password"
          minlength="4"
          required
        />
      </div>
      <div class="form-group">
        <label for="pwd-confirm" class="form-label">Ulangi Password Baru</label>
        <input
          id="pwd-confirm"
          type="password"
          class="form-input"
          autocomplete="new-password"
          minlength="4"
          required
        />
      </div>
      <button type="submit" class="btn btn-primary btn-block">Simpan Password Baru</button>
    </form>
  </div>
</section>
